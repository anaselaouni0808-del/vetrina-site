<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guy Morice, logos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Archivo:wdth,wght@62..125,300..700&display=block">
<style>
/* Une page par logo, sans texte : blanc, puis noir, puis en usage. */
:root{--paper:#F6F6F4;--white:#FFFFFF;--stone:#E9E8E4;--ink:#000000;--bronze:#9C7B4E;--grey:#9A9B98;color-scheme:light}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",Arial,sans-serif}
.slide{position:relative;height:100svh;min-height:420px;display:grid;place-items:center;scroll-snap-align:start;padding:6vw}
.slide.w{background:var(--white)}
.slide.k{background:var(--ink);color:var(--white)}
.slide.s{background:var(--stone)}
.slide svg.logo{width:min(760px,84vw);height:auto}
.slide svg.logo.tall{width:min(560px,74vw)}
.n{position:absolute;left:28px;bottom:22px;font-size:13px;color:var(--grey);font-variant-numeric:tabular-nums}
.use{display:flex;gap:min(6vw,70px);align-items:center;justify-content:center;flex-wrap:wrap}
.card{width:min(380px,80vw);aspect-ratio:85/55;background:var(--white);box-shadow:0 30px 60px -30px rgba(0,0,0,.45);display:grid;place-items:center;padding:8%}
.card.k{background:var(--ink);color:var(--white)}
.card svg{width:100%;height:auto}
.app{width:96px;height:96px;border-radius:22px;background:var(--ink);color:var(--white);display:grid;place-items:center;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.app svg{width:58%;height:auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 1. La signature : le nom en Bodoni, un filet bronze, « architecte » -->
    <symbol id="l1" viewBox="0 0 600 190">
      <text x="300" y="104" text-anchor="middle" fill="currentColor" font-family="Bodoni Moda, Georgia, serif" font-size="96" font-weight="500" style="font-variation-settings:'opsz' 18" letter-spacing="-1">Guy Morice</text>
      <line x1="196" y1="140" x2="404" y2="140" stroke="#9C7B4E" stroke-width="1.6"/>
      <text x="300" y="176" text-anchor="middle" fill="currentColor" font-family="Archivo, Arial, sans-serif" font-size="17" letter-spacing="9" opacity=".8">ARCHITECTE</text>
    </symbol>
    <symbol id="i1" viewBox="0 0 100 100">
      <text x="50" y="66" text-anchor="middle" fill="currentColor" font-family="Bodoni Moda, Georgia, serif" font-size="52" font-weight="500" style="font-variation-settings:'opsz' 18">GM</text>
      <line x1="30" y1="80" x2="70" y2="80" stroke="#9C7B4E" stroke-width="2"/>
    </symbol>

    <!-- 2. Le toit : un seul trait au-dessus du nom, qui déborde comme une toiture-terrasse -->
    <symbol id="l2" viewBox="10 0 594 170">
      <rect x="18" y="30" width="576" height="5" fill="currentColor"/>
      <text x="64" y="108" fill="currentColor" font-family="Archivo, Arial, sans-serif" font-size="58" font-weight="500" letter-spacing="12" style="font-stretch:112%">GUY MORICE</text>
      <text x="66" y="148" fill="#9C7B4E" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="8">ARCHITECTE À ESTILLAC</text>
    </symbol>
    <symbol id="i2" viewBox="0 0 100 100">
      <rect x="8" y="24" width="84" height="5" fill="currentColor"/>
      <text x="50" y="72" text-anchor="middle" fill="currentColor" font-family="Archivo, Arial, sans-serif" font-size="38" font-weight="500" letter-spacing="4" style="font-stretch:112%">GM</text>
    </symbol>

    <!-- 3. Le monogramme dessiné : G et M tracés au trait, comme sur une planche -->
    <symbol id="m3" viewBox="0 0 120 120">
      <path d="M52 22H18v76h34V62H36" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M68 98V22l17 38 17-38v76" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="18" y="108" width="84" height="2.5" fill="#9C7B4E"/>
    </symbol>
    <symbol id="l3" viewBox="0 0 590 170">
      <use href="#m3" x="0" y="15" width="140" height="140"/>
      <line x1="170" y1="40" x2="170" y2="140" stroke="currentColor" stroke-width="1.2" opacity=".35"/>
      <text x="200" y="98" fill="currentColor" font-family="Bodoni Moda, Georgia, serif" font-size="70" font-weight="500" style="font-variation-settings:'opsz' 18">Guy Morice</text>
      <text x="203" y="134" fill="currentColor" font-family="Archivo, Arial, sans-serif" font-size="15" letter-spacing="8" opacity=".8">ARCHITECTE</text>
    </symbol>
  </defs>
</svg>

<!-- Logo 1 -->
<section class="slide w" aria-label="Logo 1"><svg class="logo tall" viewBox="0 0 600 190" role="img" aria-label="Guy Morice, architecte"><use href="#l1"/></svg><span class="n">1</span></section>
<section class="slide k" aria-label="Logo 1 en négatif"><svg class="logo tall" viewBox="0 0 600 190" aria-hidden="true"><use href="#l1"/></svg><span class="n">1</span></section>
<section class="slide s" aria-label="Logo 1 en usage"><div class="use">
  <div class="card"><svg viewBox="0 0 600 190" aria-hidden="true"><use href="#l1"/></svg></div>
  <div class="card k"><svg viewBox="0 0 100 100" style="width:38%" aria-hidden="true"><use href="#i1"/></svg></div>
  <div class="app"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#i1"/></svg></div>
</div><span class="n">1</span></section>

<!-- Logo 2 -->
<section class="slide w" aria-label="Logo 2"><svg class="logo" viewBox="0 0 594 170" role="img" aria-label="Guy Morice, architecte à Estillac"><use href="#l2"/></svg><span class="n">2</span></section>
<section class="slide k" aria-label="Logo 2 en négatif"><svg class="logo" viewBox="0 0 594 170" aria-hidden="true"><use href="#l2"/></svg><span class="n">2</span></section>
<section class="slide s" aria-label="Logo 2 en usage"><div class="use">
  <div class="card"><svg viewBox="0 0 594 170" aria-hidden="true"><use href="#l2"/></svg></div>
  <div class="card k"><svg viewBox="0 0 100 100" style="width:40%" aria-hidden="true"><use href="#i2"/></svg></div>
  <div class="app"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#i2"/></svg></div>
</div><span class="n">2</span></section>

<!-- Logo 3 -->
<section class="slide w" aria-label="Logo 3"><svg class="logo" viewBox="0 0 590 170" role="img" aria-label="Monogramme GM, Guy Morice, architecte"><use href="#l3"/></svg><span class="n">3</span></section>
<section class="slide k" aria-label="Logo 3 en négatif"><svg class="logo" viewBox="0 0 590 170" aria-hidden="true"><use href="#l3"/></svg><span class="n">3</span></section>
<section class="slide s" aria-label="Logo 3 en usage"><div class="use">
  <div class="card"><svg viewBox="0 0 590 170" aria-hidden="true"><use href="#l3"/></svg></div>
  <div class="card k"><svg viewBox="0 0 120 120" style="width:34%" aria-hidden="true"><use href="#m3"/></svg></div>
  <div class="app"><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#m3"/></svg></div>
</div><span class="n">3</span></section>
</body>
</html>
